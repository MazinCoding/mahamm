# Render Blueprint: New > Blueprint > pick this repository > Apply.
# Starts on the free plans to try it out. The free database is deleted 30 days
# after creation (plus a 14-day grace period) and has no backups, so upgrade
# both to paid instance types in the dashboard before relying on it.
services:
  - type: web
    name: mahamm
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci && npm run build
    startCommand: npm run start:render
    healthCheckPath: /healthz
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: mahamm-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: DATA_ENCRYPTION_KEY
        generateValue: true
      - key: SETUP_TOKEN
        generateValue: true
      - key: APP_TIMEZONE
        value: Asia/Muscat
      # Email is optional. Leave these empty to start; invite and reset links
      # are then shown on screen for the admin to send.
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

databases:
  - name: mahamm-db
    plan: free
    region: frankfurt
    databaseName: mahamm
    user: mahamm
    # No access from the internet; only the web service can reach it.
    ipAllowList: []
