name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.24.3

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: mahamm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mahamm_test
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Install dependencies
        shell: bash
        run: |
          if [ -f package-lock.json ]; then npm ci 2>&1 | tee install-output.txt; else npm install --no-fund 2>&1 | tee install-output.txt; fi
          exit ${PIPESTATUS[0]}
      - run: npm run build
      - name: Tests
        shell: bash
        run: |
          npm test 2>&1 | tee test-output.txt
          exit ${PIPESTATUS[0]}
      - name: Screenshots of the running app
        if: success()
        shell: bash
        env:
          NODE_ENV: development
          PORT: "3000"
          APP_URL: http://localhost:3000
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/mahamm_demo
        run: |
          export SESSION_SECRET="$(openssl rand -hex 32)" DATA_ENCRYPTION_KEY="$(openssl rand -hex 32)" DEMO_PASSWORD="$(openssl rand -hex 16)"
          PGPASSWORD=postgres psql -h localhost -U postgres -c 'CREATE DATABASE mahamm_demo'
          npx playwright install --with-deps chromium > /dev/null
          node scripts/migrate.js
          node scripts/seed-demo.js
          mkdir -p /tmp/results/screens
          node scripts/screenshots.js /tmp/results/screens
      - name: Dependency audit (fails on high or critical)
        if: always()
        shell: bash
        run: |
          npm audit --omit=dev 2>&1 | tee audit-output.txt || true
          npm audit --omit=dev --audit-level=high > /dev/null
      - name: Scan the full git history for secrets
        if: always()
        shell: bash
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "/tmp/${tarball}" "${base}/${tarball}"
          curl -sSfL -o /tmp/checksums.txt "${base}/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd /tmp && grep " ${tarball}\$" checksums.txt | sha256sum -c -)
          tar -xzf "/tmp/${tarball}" -C /tmp gitleaks
          /tmp/gitleaks git --redact --verbose --exit-code 1 . 2>&1 | tee gitleaks-output.txt
          exit ${PIPESTATUS[0]}
      - name: Keep test output and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-results
          retention-days: 14
          path: |
            test-output.txt
            audit-output.txt
            gitleaks-output.txt
            /tmp/results/screens/
